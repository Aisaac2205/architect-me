    <!-- Preload critical resources -->
    <!-- Note: Actual path will be determined by Vite build, consider using a plugin for dynamic preload -->
    
    <title>Isaac Sarceño - Full Stack Developer | Portfolio</title>
  </head>

  <body>
    <div id="root">
      <!-- Critical loading skeleton - visible immediately before React loads -->
      <div id="initial-loader" style="
        position: fixed;
        inset: 0;
        background: #09090b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      ">
        <div style="
          width: 48px;
          height: 48px;
          border: 3px solid #27272a;
          border-top-color: #7c3aed;
          border-radius: 50%;
          animation: initial-spin 1s linear infinite;
        "></div>
        <p style="
          color: #a1a1aa;
          margin-top: 16px;
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 14px;
        ">Cargando...</p>
      </div>
    </div>
    
    <style>
      @keyframes initial-spin {
        to { transform: rotate(360deg); }
      }
      /* Critical CSS for instant rendering - prevents FOUC */
      html { background-color: #09090b; }
      body { 
        margin: 0; 
        background-color: #09090b; 
        color: #fafafa;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      /* Prevent layout shift for hero */
      #root { min-height: 100vh; }
    </style>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
